name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[app,dev]"
      - run: ruff check finsight tests
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t finsight:ci .
      - run: docker run --rm finsight:ci finsight --help
      - name: ingest and ask on a sample pdf with the mock backend
        run: |
          docker run --rm -e FINSIGHT_HOME=/tmp/fs finsight:ci sh -c \
            "finsight ingest samples/apple-10k-fy2023.pdf && finsight --backend mock ask 'What were total net sales?' --json" \
            | tee out.txt
          grep -q 'apple-10k-fy2023.pdf p\.' out.txt
      - run: docker compose --profile cpu config -q
